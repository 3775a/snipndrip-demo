<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SnipñDrip · Pay</title>
  <style>
    :root { --ink:#2c241c; --paper:#f7f1e8; --moss:#5c6b4f; --brick:#a33d2c; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #e8e0d4; color: var(--ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--paper); border-radius: 16px; padding: 28px 24px;
      max-width: 360px; width: 100%; box-shadow: 0 8px 32px rgba(44,36,28,.12);
    }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #6b5f54; margin-bottom: 20px; }
    .amount { font-size: 32px; font-weight: 600; margin: 16px 0; letter-spacing: -0.02em; }
    .meta { font-size: 12px; color: #8a7d6d; margin-bottom: 20px; line-height: 1.5; }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
    }
    .pay { background: var(--moss); color: #fff; }
    .fail { background: transparent; color: var(--brick); border: 1px solid #e0cfc4; }
    .note { font-size: 11px; color: #a89a89; text-align: center; margin-top: 12px; }
    .ok { color: var(--moss); font-weight: 600; text-align: center; padding: 20px 0; }
    .err { color: var(--brick); text-align: center; padding: 12px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Complete payment</h1>
    <p class="sub">Demo checkout · simulates Ozow / PayFast</p>
    <div class="amount" id="amount">—</div>
    <p class="meta" id="meta"></p>
    <button class="pay" id="btn-pay" onclick="pay(false)">Pay now</button>
    <button class="fail" id="btn-fail" onclick="pay(true)">Simulate failed payment</button>
    <p class="note">No real money moves. In production this page is Ozow or PayFast.</p>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const paymentId = q.get('payment_id');
    const amount = Number(q.get('amount') || 0);
    const provider = q.get('provider') || 'ozow';
    document.getElementById('amount').textContent = 'R' + (amount / 100).toFixed(2);
    document.getElementById('meta').textContent = 'Provider: ' + provider + ' · Payment ' + (paymentId || '').slice(0, 18) + '…';

    async function pay(fail) {
      const btn = document.getElementById(fail ? 'btn-fail' : 'btn-pay');
      btn.disabled = true;
      btn.textContent = fail ? 'Failing…' : 'Processing…';
      try {
        const res = await fetch('/payments/' + encodeURIComponent(paymentId) + '/capture', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fail: !!fail })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Payment failed');
        document.getElementById('card').innerHTML =
          '<div class="ok">Payment successful</div><p class="sub" style="text-align:center">You can close this tab and return to SnipñDrip. Your booking is confirmed once the stylist accepts.</p>' +
          '<button class="pay" onclick="window.close(); location.href=\'/\'">Back to SnipñDrip</button>';
      } catch (e) {
        document.getElementById('card').innerHTML =
          '<div class="err">' + (e.message || 'Payment failed') + '</div>' +
          '<button class="pay" onclick="location.reload()">Try again</button>' +
          '<button class="fail" onclick="location.href=\'/\'">Back</button>';
      }
    }
  </script>
</body>
</html>
